name: Syntax check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: PHP (php -l)
      run: |
        php --version
        find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

    - name: JavaScript (node --check)
      run: |
        node --version
        find public -name '*.js' -print0 | xargs -0 -n1 node --check

    - name: Shell (bash -n)
      run: bash -n start.sh
